<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Larkspur — Demo operations</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin-workspace.css">
  <script type="module" src="/admin.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="/">larkspur<span>& co.</span><i>✳</i></a>
    <nav><a href="/">Back to the shop ↗</a></nav>
    <span class="demo-label">MANAGER CONSOLE</span>
  </header>
  <main class="admin-wrap">
    <div class="admin-top">
      <div><div class="eyebrow">SHOP OPERATIONS</div><h1>Good things in motion.</h1><p class="muted">Orders, stock, fulfillment, support and workflow status in one place.</p></div>
      <button id="refresh" class="small-button">Refresh ↻</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="admin-layout">
      <nav class="admin-tabs" aria-label="Operations sections">
        <div class="admin-tab-group"><span class="admin-tab-heading">Overview</span><button data-tab="dashboard" class="active">Dashboard</button></div>
        <div class="admin-tab-group"><span class="admin-tab-heading">Customers & orders</span><button data-tab="customers">Customers</button><button data-tab="orders">Orders</button></div>
        <div class="admin-tab-group"><span class="admin-tab-heading">Fulfillment</span><button data-tab="warehouse">Warehouse</button><button data-tab="shipping">Shipping</button><button data-tab="inventory">Inventory</button></div>
        <div class="admin-tab-group"><span class="admin-tab-heading">Customer care</span><button data-tab="support">Support inbox</button><button data-tab="notifications">Message outbox</button></div>
        <div class="admin-tab-group"><span class="admin-tab-heading">System</span><button data-tab="events">Webhook events</button><button data-tab="settings">Connect n8n</button></div>
      </nav>
      <section id="content" class="admin-content" aria-live="polite"></section>
    </div>
  </main>
  <dialog id="order-dialog"><div class="dialog-head"><h2>Order workspace</h2><button id="close-dialog" aria-label="Close">×</button></div><div id="order-workspace"></div></dialog>
  <div id="toast" role="status"></div>
</body>
</html>
